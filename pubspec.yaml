name: anti_gravity_doodle_jump
description: "ZeroFlip: Up Is Down - A vertical endless platformer with gravity-flip mechanic."
publish_to: 'none'

version: 1.0.0+6
environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  sensors_plus: ^4.0.0
  shared_preferences: ^2.2.0
  audioplayers: ^5.2.0
  cupertino_icons: ^1.0.8
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
